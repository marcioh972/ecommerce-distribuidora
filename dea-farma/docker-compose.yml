services:
  db:
    image: postgres:16-alpine
    container_name: deafarma-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: deafarma
      POSTGRES_USER: deafarma
      POSTGRES_PASSWORD: deafarma
    ports:
      - "5432:5432"
    volumes:
      - deafarma_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deafarma -d deafarma"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  deafarma_pgdata:
